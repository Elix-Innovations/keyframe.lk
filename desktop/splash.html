<!doctype html>
<meta charset="utf-8">
<title>Keyframe</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { height: 100%; margin: 0; background: #0b0b0c; color: #f4f4f5; overflow: hidden; -webkit-user-select: none; user-select: none; }
  body { display: grid; place-items: center; font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-app-region: drag; }
  main { display: grid; justify-items: center; gap: 22px; }
  img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 12px 40px rgba(220, 50, 70, .35); animation: pop .5s ease-out both; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .01em; }
  .bar { width: 220px; height: 3px; border-radius: 3px; background: #26262a; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #c8203f, #fb7a5a); animation: slide 1.2s ease-in-out infinite; }
  #msg { margin: 0; min-height: 1.4em; color: #8a8a93; font-size: 12.5px; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { img, .bar i { animation: none; } }
</style>
<main>
  <img src="icon.png" alt="">
  <h1>Keyframe</h1>
  <div class="bar"><i></i></div>
  <p id="msg">Starting…</p>
</main>
<script>
  // main.js calls window.setStatus('…') as each startup step finishes.
  window.setStatus = (t) => { document.getElementById('msg').textContent = t; };
</script>

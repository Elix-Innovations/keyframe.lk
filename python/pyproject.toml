[project]
name = "keyframe-sinhala"
version = "0.1.0"
description = "Keyframe.lk Sinhala/FM font service: canonical FM table, converters, font verification and API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fonttools>=4.53",
    "pillow>=11",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=2.5.3",
    "soundfile>=0.14.0",
    "pyloudnorm>=0.2.0",
    "librosa>=1.0.0",
    "torch>=2.9",
    "transformers>=4.57",
    "uroman>=1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keyframe_sinhala"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

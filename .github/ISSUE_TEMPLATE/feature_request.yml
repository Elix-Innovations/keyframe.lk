name: Feature request
description: Suggest something new or a change to how something works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you were trying to do, not only the feature.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations: { required: true }
  - type: textarea
    id: other
    attributes:
      label: Alternatives or examples
      description: Workarounds you use today, or how another editor does it.
